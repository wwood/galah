[workspace]
name = "galah"
version = "0.1.0"
description = "CoverM tool for computing various forms of DNA sequence coverage calculations"
channels = [
    "conda-forge",
    "bioconda",
]
platforms = ["linux-64"]

# Core ANI comparison tools
[feature.core.dependencies]
skani = ">=0.2.2"
fastani = ">=1.3"

# rRNA/tRNA tools for genome quality scoring
[feature.barrnap.dependencies]
barrnap = ">=0.9"
"trnascan-se" = ">=2.0.12"

# Prokaryote quality assessment
[feature.checkm2.dependencies]
checkm2 = ">=1.1.0"

# Domain classification (conflicts with eukcc due to diamond/zlib incompatibility)
[feature.isiteuk.dependencies]
isiteuk = "*"

# Eukaryote quality assessment (conflicts with isiteuk due to diamond/zlib incompatibility)
[feature.eukcc.dependencies]
eukcc = ">=2.1.3"

# x86_64-specific dependencies
[feature.main.dependencies]

[feature.dev.dependencies]
extern = "*"
pandoc = "*"

[environments]
default = ["main", "core", "barrnap", "isiteuk"]
checkm2 = ["checkm2"]
eukcc = ["eukcc"]
isiteuk = ["isiteuk"]
osx = ["core", "barrnap", "isiteuk"]
dev = ["dev", "main", "core", "barrnap", "isiteuk"]

[tasks.release-base]
cmd = "python3 admin/release.py"

[tasks.release]
depends-on = [
    { task = "release-base", environment = "dev" },
]

[activation.env]
# Prevents packages from being loaded from the user site-packages directory
# Caused conflict when numpy==2 was loaded by CheckM2
PYTHONNOUSERSITE = "1"
